[project]
name = "document-intelligence-ml"
version = "0.1.0"
description = "Reproducible document-intelligence model development and evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema>=4.26,<5",
]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

[project.optional-dependencies]
ocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]

[project.scripts]
document-intelligence-ocr = "document_intelligence.ocr.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.26.0.20260518,<5",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "document_intelligence"

[tool.uv]
required-version = "==0.12.7"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "UP",
]
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
